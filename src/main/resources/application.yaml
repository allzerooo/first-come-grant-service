spring:
  application:
    name: first-come-grant-service
  datasource:
    url: jdbc:postgresql://localhost:5432/first-come-grant
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway가 스키마 관리, Hibernate는 검증만
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.toy.first_come_grant_service: DEBUG
    org.flywaydb: DEBUG
